  <rect x="440" y="140" width="480" height="540" rx="18" fill="#0F172A" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="680" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#60A5FA" text-anchor="middle">callModelWithTelemetry()</text>

  <rect x="475" y="210" width="410" height="78" rx="12" fill="#1E293B" stroke="#38BDF8"/>
  <text x="680" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Cache Check (FR-TR-04)</text>
  <text x="680" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="middle">If cacheHit = true → return cached output with $0.00 cost</text>

  <rect x="475" y="310" width="410" height="90" rx="12" fill="#1E293B" stroke="#8B5CF6"/>
  <text x="680" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#C4B5FD" text-anchor="middle">2. Provider Router &amp; Text Failover (NFR-18)</text>
  <text x="680" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="middle">Routes to Meta Model API; auto-falls back to</text>
  <text x="680" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E9D5FF" text-anchor="middle">Muse Spark Open (fallback = true) if primary fails</text>

  <rect x="475" y="420" width="410" height="90" rx="12" fill="#1E293B" stroke="#F59E0B"/>
  <text x="680" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FCD34D" text-anchor="middle">3. Zod Schema Validator &amp; 1x Retry (NFR-16)</text>
  <text x="680" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="middle">Parses JSON &amp; validates schema; on failure,</text>
  <text x="680" y="496" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FDE68A" text-anchor="middle">retries once with Zod error context injected</text>

  <rect x="475" y="530" width="410" height="115" rx="12" fill="#064E3B" stroke="#10B981"/>
  <text x="680" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#6EE7B7" text-anchor="middle">4. Cost &amp; Telemetry Emitter (FR-CL-01..02)</text>
  <text x="680" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">Computes latencyMs &amp; costUsd (~$0.062 / carousel)</text>
  <text x="680" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">Emits model_calls row to Activity Panel sink</text>

  <line x1="920" y1="260" x2="1010" y2="220" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="920" y1="360" x2="1010" y2="395" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="920" y1="585" x2="1010" y2="585" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/>

