  <text x="1180" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0" text-anchor="middle">• Muse Image (1080×1350 Scene)</text>
  <text x="1180" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0" text-anchor="middle">• SAM 3.1 (Product Cutout)</text>

  <rect x="1020" y="330" width="320" height="135" rx="16" fill="#3B0764" stroke="#C084FC" stroke-width="1.5"/>
  <text x="1180" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#E9D5FF" text-anchor="middle">Muse Spark Open</text>
  <text x="1180" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0" text-anchor="middle">Hosted on Baseten / Modal</text>
  <text x="1180" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FDE047" text-anchor="middle">0–100 Trend Scoring + Text Fallback</text>

  <rect x="1020" y="495" width="320" height="185" rx="16" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1180" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#6EE7B7" text-anchor="middle">Agent Activity Panel</text>
  <text x="1180" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#D1FAE5" text-anchor="middle">Persists to model_calls table:</text>
  <text x="1180" y="592" font-family="monospace" font-size="13" fill="#A7F3D0" text-anchor="middle">step, model, tokensIn/Out,</text>
  <text x="1180" y="614" font-family="monospace" font-size="13" fill="#A7F3D0" text-anchor="middle">images, latencyMs, costUsd,</text>
  <text x="1180" y="636" font-family="monospace" font-size="13" fill="#A7F3D0" text-anchor="middle">cacheHit, fallback</text>
