  <text x="90" y="225" font-family="monospace" font-size="15" fill="#E2E8F0">• extract_products</text>
  <text x="90" y="260" font-family="monospace" font-size="15" fill="#E2E8F0">• cutout</text>
  <text x="90" y="295" font-family="monospace" font-size="15" fill="#E2E8F0">• research_trends</text>
  <text x="90" y="330" font-family="monospace" font-size="15" fill="#E2E8F0">• score_trend</text>
  <text x="90" y="365" font-family="monospace" font-size="15" fill="#E2E8F0">• analyse_trend</text>
  <text x="90" y="400" font-family="monospace" font-size="15" fill="#E2E8F0">• plan_post</text>
  <text x="90" y="435" font-family="monospace" font-size="15" fill="#E2E8F0">• check_rules</text>
  <text x="90" y="470" font-family="monospace" font-size="15" fill="#E2E8F0">• render_image</text>
  <text x="90" y="505" font-family="monospace" font-size="15" fill="#E2E8F0">• verify_slide</text>
  <text x="90" y="540" font-family="monospace" font-size="15" fill="#E2E8F0">• regenerate_caption</text>
  <text x="90" y="575" font-family="monospace" font-size="15" fill="#E2E8F0">• regenerate_image</text>
  <text x="90" y="610" font-family="monospace" font-size="15" fill="#E2E8F0">• weekly_learning</text>

  <line x1="340" y1="410" x2="430" y2="410" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr)"/>

