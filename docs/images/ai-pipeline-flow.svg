  <text x="985" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FCE7F3" text-anchor="middle">Verifies Shop Tone + up to 10 Rules</text>
  <text x="985" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FBBF24" text-anchor="middle">e.g. "Never show prices" / no false claims</text>
  <text x="985" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Fail → Regenerate once, then flag</text>

