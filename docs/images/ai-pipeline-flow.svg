  <text x="1370" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FCA5A5" text-anchor="middle">Never prompted to draw the product</text>

  <line x1="1370" y1="325" x2="1370" y2="360" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1215" y="365" width="310" height="105" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1370" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#6EE7B7" text-anchor="middle">sharp Deterministic Compositor</text>
  <text x="1370" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">Places confirmed SAM 3.1 cutout into</text>
  <text x="1370" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">reserved box (scale + drop shadow)</text>

  <line x1="1370" y1="470" x2="1370" y2="505" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1215" y="510" width="310" height="95" rx="12" fill="#172554" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="1370" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle">Fidelity Check (Code + Muse Spark)</text>
  <text x="1370" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Pixel diff vs cutout + spelling check</text>
  <text x="1370" y="584" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6EE7B7" text-anchor="middle">Unlocks "Real Product" Badge on /today</text>

  <rect x="1215" y="620" width="310" height="70" rx="12" fill="#10B981"/>
  <text x="1370" y="652" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#064E3B" text-anchor="middle">READY FOR 1-TAP APPROVE</text>
  <text x="1370" y="674" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">Before/After Toggle + Live Activity Panel</text>

  <!-- Cross-column connectors -->
  <path d="M 400 160 L 430 160" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 780 160 L 810 160" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1160 160 L 1190 160" stroke="#F472B6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Bottom Banner: Single Model Gateway (Issue #2) -->
  <rect x="50" y="750" width="1500" height="185" rx="18" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
  <text x="85" y="792" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#60A5FA">PILLAR 3 FOUNDATION — SINGLE MODEL GATEWAY (src/lib/gateway/index.ts)</text>
  <text x="85" y="820" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#CBD5E1">Every AI call in Columns 1–4 passes through callModelWithTelemetry(). Zero direct provider calls allowed outside the gateway.</text>

  <rect x="85" y="845" width="330" height="68" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="250" y="874" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">Zod Schema Validation (NFR-16)</text>
  <text x="250" y="896" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Auto-retries once with validation diff</text>

  <rect x="445" y="845" width="340" height="68" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="615" y="874" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#C084FC" text-anchor="middle">Muse Spark Open Fallback (NFR-18)</text>
  <text x="615" y="896" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Seamless text failover on API outage</text>

  <rect x="815" y="845" width="340" height="68" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="985" y="874" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#6EE7B7" text-anchor="middle">Cost &amp; Latency Telemetry (FR-CL-01)</text>
  <text x="985" y="896" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Logs tokens, images, ms, USD &amp; cacheHit</text>

  <rect x="1185" y="845" width="330" height="68" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="1350" y="874" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="middle">Deterministic Mock Mode</text>
  <text x="1350" y="896" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Full offline CI &amp; local dev smoke tests</text>
