  <rect x="810" y="135" width="350" height="585" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="810" y="135" width="350" height="48" rx="16" fill="#1E293B"/>
  <text x="834" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#F472B6">3. CAROUSEL PLANNER &amp; RULES</text>

