  <text x="985" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">• Scene Brief per Slide (EN / ID)</text>

  <line x1="985" y1="505" x2="985" y2="545" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="835" y="550" width="300" height="140" rx="12" fill="#3F1D38" stroke="#EC4899" stroke-width="1.5"/>
