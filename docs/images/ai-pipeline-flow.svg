  <text x="225" y="647" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#6EE7B7" text-anchor="middle">Owner Confirms Cutout (Step 3)</text>
  <text x="225" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D1FAE5" text-anchor="middle">Locked as source-of-truth product pixels</text>

