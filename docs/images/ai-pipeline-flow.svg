<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="6" fill="url(#accent)"/>

  <!-- Header -->
  <text x="60" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#F8FAFC">MARKEN — Autonomous AI Marketing &amp; Pillar 1 Studio Pipeline</text>
  <text x="60" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8">"Your real product, never redrawn." · 5 Meta Models + Deterministic Sharp Compositing + Pixel Fidelity Verification</text>
  <rect x="1290" y="42" width="250" height="42" rx="21" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1415" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="middle">Target Cost: &lt; $0.10 / Post</text>

  <!-- Column 1: Onboarding & Cutout -->
  <rect x="50" y="135" width="350" height="585" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="50" y="135" width="350" height="48" rx="16" fill="#1E293B"/>
  <text x="74" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">1. ONBOARDING &amp; CUTOUT</text>

  <rect x="75" y="210" width="300" height="86" rx="12" fill="#1E293B" stroke="#475569"/>
  <text x="225" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">Owner Uploads 3–10 Photos</text>
  <text x="225" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Physical product photos from phone</text>

  <line x1="225" y1="296" x2="225" y2="335" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="75" y="340" width="300" height="105" rx="12" fill="#172554" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="225" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="middle">Muse Spark (Vision JSON)</text>
  <text x="225" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Extracts name, category, attributes</text>
  <text x="225" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FBBF24" text-anchor="middle">Guardrail: price = null if unseen</text>

  <line x1="225" y1="445" x2="225" y2="480" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="75" y="485" width="300" height="105" rx="12" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="225" y="517" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#C4B5FD" text-anchor="middle">SAM 3.1 Segmentation</text>
  <text x="225" y="543" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Cuts out real product into</text>
  <text x="225" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#A7F3D0" text-anchor="middle">Confirmed Transparent PNG</text>

