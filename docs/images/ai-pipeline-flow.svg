  <text x="985" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#CBD5E1" text-anchor="middle">• No skipped trend in last 7 posts</text>

  <line x1="985" y1="325" x2="985" y2="365" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="835" y="370" width="300" height="135" rx="12" fill="#172554" stroke="#3B82F6" stroke-width="1.5"/>
