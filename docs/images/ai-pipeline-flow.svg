  <rect x="430" y="135" width="350" height="585" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="430" y="135" width="350" height="48" rx="16" fill="#1E293B"/>
  <text x="454" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#A78BFA">2. DAILY TREND ENGINE</text>

  <rect x="455" y="210" width="300" height="100" rx="12" fill="#172554" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="605" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="middle">Muse Wonder (Web Agent)</text>
  <text x="605" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Browses TikTok Creative Center &amp;</text>
  <text x="605" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Google Trends (Fallback: Muse Spark)</text>

  <line x1="605" y1="310" x2="605" y2="345" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="455" y="350" width="300" height="100" rx="12" fill="#3B0764" stroke="#C084FC" stroke-width="1.5"/>
  <text x="605" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#E9D5FF" text-anchor="middle">Muse Spark Open (Baseten)</text>
  <text x="605" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Scores candidates 0–100 on</text>
  <text x="605" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FDE047" text-anchor="middle">Product Fit &amp; Momentum</text>

  <line x1="605" y1="450" x2="605" y2="485" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="455" y="490" width="300" height="100" rx="12" fill="#172554" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="605" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="middle">Muse Spark (Multimodal)</text>
  <text x="605" y="546" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Extracts hook, structure, visual_style</text>
  <text x="605" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">&amp; reusable scene_brief</text>

  <rect x="455" y="615" width="300" height="75" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="605" y="647" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7DD3FC" text-anchor="middle">7-Day Shared Trend Cache</text>
  <text x="605" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">2nd shop triggers 0 extra analysis calls</text>

